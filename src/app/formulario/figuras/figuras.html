<div class="col-md-4">
    <div class="mb-3">
        <form action="">
            <div class="form-group pt-4">

            </div>

            <div class="form-group pt-4">
                <label for="num1">Ingresa el lado x</label>
                <input [(ngModel)]='num1' type="text" class="form-control" name="num1"
                    placeholder="Ingrese el numero 1">
            </div>
            <div class="form-group pt-4">
                <label for="num1">Ingresa el lado y</label>
                <input [(ngModel)]='num2' type="text" class="form-control" name="num2"
                    placeholder="Ingrese el numero 2">
            </div>
            <br>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="radio1" value="cube"
                    [(ngModel)]="tipoOperacion">
                <label class="form-check-label" for="radio1">
                    Cuadrado
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="radio2" value="rect"
                    [(ngModel)]="tipoOperacion">
                <label class="form-check-label" for="radio2">
                    Rectangulo
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="radio3" value="poly"
                    [(ngModel)]="tipoOperacion">
                <label class="form-check-label" for="radio3">
                    Poligono
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="radio4" value="tri"
                    [(ngModel)]="tipoOperacion">
                <label class="form-check-label" for="radio4">
                    Triangulo
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="radio5" value="circ"
                    [(ngModel)]="tipoOperacion">
                <label class="form-check-label" for="radio5">
                    Circulo
                </label>
            </div>

            <button class="btn btn-primary mt-3" (click)="calcular()">Calcular</button>

        </form>
    </div>
</div>
<div class="col-6">
    <h2>Resultado: {{resultado}} u<sup>2</sup></h2>
</div>
