<div class="col-md-4">
    <div class="mb-3">
        <form action="">
            <div class="form-group pt-4">

            </div>

            <div class="form-group pt-4">
                <label for="num1">Numero 1</label>
                <input [(ngModel)]='num1' type="text" class="form-control" name="num1"
                    placeholder="Ingrese el numero 1">
            </div>
            <div class="form-group pt-4">
                <label for="num1">Numero 2</label>
                <input [(ngModel)]='num2' type="text" class="form-control" name="num2"
                    placeholder="Ingrese el numero 2">
            </div>
            <br>
            <!-- <button (click)="sumar()" type="button" class="btn btn-primary m-1">Sumar</button>
            <button (click)="restar()" type="button" class="btn btn-danger m-1">Restar</button>
            <button (click)="multi()" type="button" class="btn btn-warning m-1">Multiplicar</button>
            <button (click)="dividir()" type="button" class="btn btn-success m-1">Dividir</button> -->

            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="radioSumar" value="sumar"
                    [(ngModel)]="tipoOperacion">
                <label class="form-check-label" for="radioSumar">
                    Sumar
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="radioRestar" value="restar"
                    [(ngModel)]="tipoOperacion">
                <label class="form-check-label" for="radioRestar">
                    Restar
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="radioMultiplicar" value="multi"
                    [(ngModel)]="tipoOperacion">
                <label class="form-check-label" for="radioMultiplicar">
                    Multiplicar
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" id="radioDividir" value="dividir"
                    [(ngModel)]="tipoOperacion">
                <label class="form-check-label" for="radioDividir">
                    Dividir
                </label>
            </div>

            <button class="btn btn-primary mt-3" (click)="calcular()">Enviar Opción</button>

        </form>
    </div>
</div>
<div class="col-6">
    <h2>Resultado: {{resultado}}</h2>
</div>
